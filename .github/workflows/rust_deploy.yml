name: Deploy Terrarium
concurrency: deploy

run-name: Deploy Terrarium @ ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: "main"
  # Manual redeploy of main — revives the service after a crash/reboot
  # without waiting for a code change (terrarium served 502s for a week
  # because the only restart lever was a deploy).
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the selected revision or inspect the host configuration
        type: choice
        options: [deploy, inspect]
        default: deploy

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation != 'inspect') || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-01-26

      - name: Build
        run: cargo build --release --bin web-axum --locked

      - name: Upload Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: web-axum
          path: target/release/web-axum
          retention-days: 1

  deploy:
    name: Deploy to Terrarium
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # Required for OIDC
    steps:
      - name: Download Release Binary
        uses: actions/download-artifact@v4
        with:
          name: web-axum

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          tags: tag:ci

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H terrarium >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy Binary
        run: |
          chmod +x web-axum
          scp -o StrictHostKeyChecking=no web-axum www@terrarium:~/server/web-axum.new
          ssh www@terrarium "mv ~/server/web-axum.new ~/server/web-axum"

      - name: Restart Service
        run: |
          ssh circle@terrarium "sudo systemctl restart terrarium.coreyja.com.service"

  inspect:
    name: Inspect Terrarium
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          tags: tag:ci

      - name: Setup SSH Key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H terrarium >> ~/.ssh/known_hosts

      - name: Inspect service and deployment permissions
        run: |
          ssh -o BatchMode=yes circle@terrarium 'id; hostname; sudo -n -l; systemctl show terrarium.coreyja.com.service -p FragmentPath -p User -p Group -p WorkingDirectory -p EnvironmentFiles -p ActiveState -p SubState -p Result -p ExecMainStatus'
          ssh -o BatchMode=yes www@terrarium 'id; ls -ld ~ ~/server; find ~/server -maxdepth 1 -type f -printf "%f %m %u\n"'
