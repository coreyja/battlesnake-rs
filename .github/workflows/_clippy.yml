name: Clippy

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # `--benches` matters: nothing else in CI compiles them. benches.yml is
      # `workflow_dispatch`-only, and `cargo test` does not build bench targets, so the benches sat
      # broken on main for an unknown length of time with every check green.
      - name: Run clippy
        run: cargo clippy --workspace --lib --bins --tests --benches --no-deps --locked -- -D warnings
